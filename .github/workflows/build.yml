name: Build and Push Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  schedule:
    # Check for new cloudflared and Alpine releases daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "cloudflared version to build without tagging latest (e.g. 2026.3.0); leave empty for the one in the Dockerfile"
        required: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cloudflared

jobs:
  # Bumps the versions in the Dockerfile and README with a commit. The commit
  # also keeps the repo active, so GitHub does not disable the schedule after
  # 60 days. A push made with GITHUB_TOKEN starts no new run, hence the build
  # job below is chained to this one.
  bump:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve latest versions
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CLOUDFLARED=$(gh api repos/cloudflare/cloudflared/releases/latest --jq .tag_name)
          ALPINE=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/latest-releases.yaml \
            | awk '/branch:/ { sub("v", "", $2); print $2; exit }')
          test -n "$CLOUDFLARED" && test -n "$ALPINE"
          echo "cloudflared=${CLOUDFLARED}" >> "$GITHUB_OUTPUT"
          echo "alpine=${ALPINE}" >> "$GITHUB_OUTPUT"
          echo "Latest: cloudflared ${CLOUDFLARED}, alpine ${ALPINE}"

      - name: Update Dockerfile and README
        env:
          CLOUDFLARED: ${{ steps.latest.outputs.cloudflared }}
          ALPINE: ${{ steps.latest.outputs.alpine }}
        run: |
          sed -i -E "s/^(ARG CLOUDFLARED_VERSION=).*/\1${CLOUDFLARED}/; s/^FROM alpine:.*/FROM alpine:${ALPINE}/" Dockerfile
          sed -i -E "s/^(\| cloudflared +\| \`)[^\`]*/\1${CLOUDFLARED}/; s/^(\| Base +\| \`alpine:)[^\`]*/\1${ALPINE}/" README.md
          git diff

      - name: Commit
        id: commit
        env:
          CLOUDFLARED: ${{ steps.latest.outputs.cloudflared }}
          ALPINE: ${{ steps.latest.outputs.alpine }}
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "cloudflared ${CLOUDFLARED} on alpine ${ALPINE}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    # Runs on push and manual dispatch (bump skipped), and on schedule only
    # when bump committed something.
    if: >-
      !cancelled() &&
      (github.event_name != 'schedule' || needs.bump.outputs.changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha || github.sha }}

      - name: Resolve cloudflared version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            LATEST=false
          else
            VERSION=$(sed -n 's/^ARG CLOUDFLARED_VERSION=//p' Dockerfile)
            LATEST=true
          fi
          test -n "$VERSION"
          {
            echo "version=${VERSION}"
            echo "latest=${LATEST}"
            echo "alpine=$(sed -n 's/^FROM alpine://p' Dockerfile)"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Building cloudflared ${VERSION} (latest: ${LATEST})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/arm/v7
          push: true
          build-args: |
            CLOUDFLARED_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.latest == 'true' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One release per cloudflared version, tagged at the commit it was built
      # from. A rebuild of the same version (Alpine bump, workflow change) is
      # appended to that release's list of builds. Backfills get no release.
      - name: Release
        if: steps.version.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ALPINE: ${{ steps.version.outputs.alpine }}
          REVISION: ${{ steps.version.outputs.revision }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          BUILD="- $(date -u +%F): alpine ${ALPINE}, \`${DIGEST}\`, ${REVISION:0:7}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            { gh release view "$VERSION" --json body --jq .body; echo "$BUILD"; } \
              | gh release edit "$VERSION" --notes-file -
          else
            cat <<NOTES | gh release create "$VERSION" --target "$REVISION" --title "cloudflared ${VERSION}" --latest --notes-file -
          [cloudflared ${VERSION}](https://github.com/cloudflare/cloudflared/releases/tag/${VERSION}) on Alpine, for \`linux/arm64\` and \`linux/arm/v7\`.

          \`\`\`
          ${IMAGE_NAME}:${VERSION}
          \`\`\`

          Builds:
          ${BUILD}
          NOTES
          fi
